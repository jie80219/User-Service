version: "3"

# DB credentials, JWT secret, and CI4 .env are produced by the vault-agent
# sidecar from the shared docker/vault/creds bind mount (populated by the
# main compose's vault-init). Run `bash scripts/vault-bootstrap.sh` from
# the repo root before bringing this compose up.

services:
    vault-agent-user:
        image: hashicorp/vault:1.18
        container_name: user-vault-agent
        entrypoint: ["/bin/sh", "-c"]
        command:
            - "chown -R vault:vault /vault/out; exec docker-entrypoint.sh agent -config=/vault/config.hcl"
        environment:
            # Default = docker DNS (single-host). Set VAULT_ADDR in this
            # host's .env (e.g. http://10.1.1.209:8200) to point at the
            # gateway-host vault server when running cross-host.
            VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
        networks:
            - anser_project_network
        volumes:
            - ../../docker/vault/agent/user-svc.hcl:/vault/config.hcl:ro
            - ../../docker/vault/templates:/vault/templates:ro
            - ../../docker/vault/creds:/vault/creds:ro
            - vault_ci4_user:/vault/out

    user-service:
        image: webdevops/php:8.1
        platform: linux/x86_64
        networks:
            - anser_project_network
        ports:
            - 8080:8080
        working_dir: /app
        environment:
            - WEB_DOCUMENT_ROOT=/app/public
            - PHP_MEMORY_LIMIT=2048M
            - PHP_MAX_EXECUTION_TIME=300
            - PHP_POST_MAX_SIZE=2048M
            - PHP_UPLOAD_MAX_FILESIZE=2048M
        volumes:
            - './app:/app'
            - vault_ci4_user:/vault/out:ro
        depends_on:
            - vault-agent-user
        command: >
            bash -c "until [ -s /vault/out/.env ]; do sleep 0.2; done;
            cp /vault/out/.env /app/.env;
            chmod 776 ./start_service.sh && ./start_service.sh"
    user_DB:
        image: postgres:11.12
        networks:
            - anser_project_network
        environment:
            POSTGRES_DB: user
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        volumes:
            - ./user-db-data:/var/lib/postgresql/data/
        ports:
            - "8340:5432"
        command:
            [
                "postgres",
                "-c",
                "logging_collector=on",
                "-c",
                "log_destination=stderr",
                "-c",
                "max_connections=10000"
            ]
    # user_test_DB:
    #     image: postgres:11.12
    #     networks:
    #         - anser_project_network
    #     environment:
    #         POSTGRES_DB: user
    #         POSTGRES_USER: root
    #         POSTGRES_PASSWORD: root
    #     volumes:
    #         - ./user-test-db-data:/var/lib/postgresql/data/
    #     ports:
    #         - "8341:5432"
    #     command:
    #         [
    #             "postgres",
    #             "-c",
    #             "logging_collector=on",
    #             "-c",
    #             "log_destination=stderr",
    #             "-c",
    #             "max_connections=10000"
    #         ]
volumes:
    vault_ci4_user:
networks:
    anser_project_network:
        external: true
